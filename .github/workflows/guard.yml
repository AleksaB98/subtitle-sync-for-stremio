name: Keep the rules

on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read
  discussions: write

concurrency:
  group: guard-${{ github.event.comment.node_id || github.event.discussion.node_id }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/guard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/guard/guard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The site and word lists, kept private (see patterns.mjs).
          GUARD_RULES: ${{ secrets.GUARD_RULES }}
      # A new discussion like earlier ones: they are listed in a comment, and the owner told in #mod-alerts.
      - if: github.event_name == 'discussion' && github.event.action == 'created'
        run: node .github/guard/similar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_ALERTS_WEBHOOK: ${{ secrets.MOD_ALERTS_WEBHOOK }}
