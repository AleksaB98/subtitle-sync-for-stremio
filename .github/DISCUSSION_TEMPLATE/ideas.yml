body:
  - type: markdown
    attributes:
      value: |
        An idea for Subtitle Sync: a subtitle site, a language, something on the setup page. Others can upvote it.
        **Never paste your install link or any key here.**
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like, and when it would help you.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post follows [the rules](https://github.com/AleksaB98/subtitle-sync-for-stremio/blob/main/CODE_OF_CONDUCT.md).
          required: true
