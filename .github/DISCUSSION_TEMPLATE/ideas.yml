body:
  - type: markdown
    attributes:
      value: |
        A suggestion for Subtitle Sync: a subtitle site, a language, something on the setup page. Others can upvote it.
        **Never paste your install link or any key here.**
  - type: checkboxes
    id: searched
    attributes:
      label: Looked first
      options:
        - label: I looked for an existing suggestion like this first (the search box above the list). If there is one, I upvote it instead.
          required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: What you would like, and when it would help you.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post follows [the rules](https://github.com/AleksaB98/subtitle-sync-for-stremio/blob/main/CODE_OF_CONDUCT.md).
          required: true
