body:
  - type: markdown
    attributes:
      value: |
        **Never paste your install link or any key here.** Anyone could use your accounts with it. A post that has one is removed by itself.
        Your support code is all I need: in Stremio, open Addons, find Subtitle Sync and press its gear (Configure). The code is at the top. Copy it right before you post: a new key or link gives a new code.
        Something private? Write from the setup page instead: https://subtitlesync.stream/help#contact
  - type: input
    id: code
    attributes:
      label: Support code
      placeholder: 1A2B-3C4D-5E6F
  - type: input
    id: app
    attributes:
      label: App and device
      placeholder: Stremio on an Android TV box, Stremio Web in Chrome, ...
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Film or episode
      placeholder: "The film's name, or the show with season and episode"
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you tried and what you saw. A screenshot helps.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post has no install link or key, and no links to videos or to sites for getting them ([the rules](https://github.com/AleksaB98/subtitle-sync-for-stremio/blob/main/CODE_OF_CONDUCT.md)).
          required: true
